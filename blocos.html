<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Estoura Blocos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="core.js"></script>
<script>
Motor({
  id:'blocos', nome:'Estoura Blocos', titulo:'ESTOURA <span>BLOCOS</span>', meta:5000,
  regras:'Toque num grupo de <b>3 ou mais blocos iguais</b> grudados para estourar. Quanto maior o grupo, mais pontos. Grupo de 8+ dá <b>jogada extra</b>. Você tem 30 jogadas.',
  iniciar({ seed, area, ouro, fim }){
    const r=rng(seed), C=7, L=9, N=C*L;
    const CORES = ouro ? ['#f5b301','#e0a100','#ffcf4a','#c58a00','#ffe08a'] : ['#ef4444','#22c55e','#3b82f6','#f5b301','#a855f7'];
    const SIM = ['●','▲','■','◆','★'];
    let g=[], jog=30, pts=0, trava=false;
    const cor = () => Math.floor(r()*5);

    const hud=document.createElement('div'); hud.className='hud'; area.appendChild(hud);
    const el=document.createElement('div'); el.className='bgrid'; area.appendChild(el);
    const cel=[];
    for (let i=0;i<N;i++){
      const d=document.createElement('div'); d.className='bc';
      d.onpointerdown = e => { e.preventDefault(); toque(i); };
      el.appendChild(d); cel.push(d);
    }
    function grupo(i){
      const alvo=g[i], vis=new Set([i]), pilha=[i];
      while (pilha.length){
        const k=pilha.pop(), x=k%C, y=(k/C)|0;
        for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=x+dx, ny=y+dy; if (nx<0||ny<0||nx>=C||ny>=L) continue;
          const n=ny*C+nx; if (!vis.has(n) && g[n]===alvo){ vis.add(n); pilha.push(n); }
        }
      }
      return [...vis];
    }
    const temJogada = () => { for (let i=0;i<N;i++) if (grupo(i).length>=3) return true; return false; };
    function garantir(){ let k=0; while (!temJogada() && k<30){ for (let i=0;i<N;i++) g[i]=cor(); k++; } }
    function gravidade(){
      for (let x=0;x<C;x++){
        const col=[]; for (let y=L-1;y>=0;y--){ const v=g[y*C+x]; if (v>=0) col.push(v); }
        let y=L-1; for (const v of col){ g[y*C+x]=v; y--; }
        for (; y>=0; y--) g[y*C+x]=cor();
      }
    }
    function desenha(){
      for (let i=0;i<N;i++){ cel[i].style.background=CORES[g[i]]; cel[i].textContent=SIM[g[i]]; }
      hud.innerHTML = `<b>${fmt(pts)}</b><span>Jogadas: <b>${jog}</b></span>`;
    }
    function toque(i){
      if (trava || jog<=0) return;
      const gr=grupo(i);
      if (gr.length<3){ cel[i].classList.add('nao'); setTimeout(()=>cel[i].classList.remove('nao'),250); vibrar(30); return; }
      trava=true; jog--;
      const n=gr.length, ganho=n*(n-1)*5; pts+=ganho;
      if (n>=8){ jog++; setTimeout(()=>popTxt('+1 jogada!','#f5b301'),250); }
      popTxt('+'+fmt(ganho), '#22c55e'); vibrar(n>=8?[20,30,20]:15);
      gr.forEach(k=>cel[k].classList.add('estoura'));
      hud.innerHTML = `<b>${fmt(pts)}</b><span>Jogadas: <b>${jog}</b></span>`;
      setTimeout(()=>{
        gr.forEach(k=>{ g[k]=-1; cel[k].classList.remove('estoura'); });
        gravidade(); garantir(); desenha(); trava=false;
        if (jog<=0) setTimeout(()=>fim(pts), 600);
      }, 220);
    }
    for (let i=0;i<N;i++) g.push(cor());
    garantir(); desenha();
  }
});
</script>
</body>
</html>
