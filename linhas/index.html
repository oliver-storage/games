<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b3e">
<title>Linha de Cores 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 20%,#24407a 0%,#0d1b3e 55%,#060c1f 100%);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
#cena{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:10px 12px calc(6px);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2;max-width:620px;margin:0 auto}
.hud>*{pointer-events:auto}
.linha1{display:flex;gap:8px;align-items:center}
.chip{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap}
a.chip{color:#fff;text-decoration:none}
.placar{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.placar b{font-size:30px;text-shadow:0 2px 12px rgba(80,180,255,.7)}
.placar small{font-size:11px;opacity:.7;margin-top:2px}
.prox{display:flex;align-items:center;gap:6px}
.prox small{font-size:11px;opacity:.75;font-weight:700}
.bola{width:20px;height:20px;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.4)}
.nivel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800}
.nbar{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.nbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ddc84,#46a8ff);transition:width .5s}
.missoes{display:flex;gap:6px;overflow-x:auto}
.mis{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 9px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.mis.ok{background:rgba(61,220,132,.25);border-color:#3ddc84}
.base{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:2}
.bt{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 14px;font-weight:800;font-size:15px;min-width:86px}
.bt small{display:block;font-size:11px;color:#ffd93b;font-weight:800}
.bt.ativo{background:#ff5b5b;border-color:#fff}
.bt:active{transform:scale(.95)}
#voos{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.voo{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px currentColor;animation:voo 1.1s ease-out forwards;white-space:nowrap}
@keyframes voo{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-70%) scale(1.15);opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}
.grito{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;z-index:4;pointer-events:none;animation:grito 1.2s forwards;white-space:nowrap;background:linear-gradient(90deg,#ff4d6a,#ffd93b,#3ddc84,#46a8ff,#b56bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
@keyframes grito{0%{transform:translate(-50%,-50%) scale(.2)}25%{transform:translate(-50%,-50%) scale(1.2)}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:9px 16px;border-radius:18px;font-weight:800;font-size:14px;z-index:5;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(5,10,30,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:linear-gradient(160deg,#1d3166,#121f45);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:entra .35s cubic-bezier(.34,1.5,.64,1);max-height:92dvh;overflow-y:auto}
@keyframes entra{from{transform:scale(.7);opacity:0}}
.mbox h2{font-size:28px}
.mbox p{margin-top:8px;line-height:1.4;color:#cfd8ff}
.grande{font-size:56px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#ffd93b,#ff7ec0);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-size:18px;font-weight:900;margin-top:10px;background:linear-gradient(180deg,#46a8ff,#1f6fe0);box-shadow:0 5px 0 #144fa8}
.btn.verde{background:linear-gradient(180deg,#5fe07a,#22b04a);box-shadow:0 5px 0 #17803a}
.btn.sec{background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px)}
.regras{text-align:left;font-size:14px;line-height:1.5;color:#dfe6ff;margin-top:8px}
.regras li{margin:4px 0 4px 18px}
.lmis{text-align:left;margin-top:10px;font-size:14px}
.lmis div{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.moedas{display:inline-block;margin-top:6px;background:rgba(255,217,59,.15);color:#ffd93b;border-radius:12px;padding:4px 12px;font-weight:900}
@media (orientation:landscape) and (max-height:560px){
  .hud{left:0;right:auto;width:min(44vw,330px);margin:0;padding:8px}
  .linha1{flex-wrap:wrap}
  .missoes{flex-direction:column;overflow:visible}
  .base{left:auto;right:0;top:0;bottom:0;flex-direction:column;justify-content:center;padding:8px}
}
footer{position:fixed;bottom:2px;left:0;right:0;text-align:center;font-size:10px;opacity:.45;z-index:1;pointer-events:none}
</style>
</head>
<body>
<canvas id="cena"></canvas>
<div class="hud">
  <div class="linha1">
    <a class="chip" href="../index.html">‹</a>
    <span class="chip" id="h-rec">🏆 0</span>
    <div class="placar"><b id="h-pts">0</b><small>pontos</small></div>
    <span class="chip" id="h-moe">🪙 0</span>
    <button class="chip" id="h-som">🔊</button>
  </div>
  <div class="linha1">
    <div class="prox"><small>Próximas</small><span class="bola" id="p0"></span><span class="bola" id="p1"></span><span class="bola" id="p2"></span></div>
    <div class="nivel" style="flex:1"><span id="h-niv">Nv 1</span><div class="nbar"><i id="h-xp"></i></div></div>
  </div>
  <div class="missoes" id="h-mis"></div>
</div>
<div class="base">
  <button class="bt" id="b-desf">↩️ Desfazer<small>🪙 15</small></button>
  <button class="bt" id="b-bomba">💣 Bomba<small>🪙 25</small></button>
  <button class="bt" id="b-menu">☰ Menu</button>
</div>
<div id="voos"></div>
<div id="toast"></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<footer id="rodape"></footer>
<script src="../lib/three.min.js"></script>
<script>
// Linha de Cores 3D — Vettore Sistemas
const CONFIG = { SISTEMA:'Linha de Cores 3D', VERSAO:'0.1.1.0', DESENVOLVEDOR:'Vettore Sistemas' };
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('pt-BR');
const N=9, CORES=['#ff3b5c','#ff9f1c','#ffe14d','#2ecc71','#1fb5ff','#7b5cff','#ff5fd2'], CORINGA=7;
const NOMES_COR=['vermelha','laranja','amarela','verde','azul','roxa','rosa'];
const PRECO={desf:15,bomba:25};

// ---------- Save ----------
const SK='linha_cores_3d_v1';
let S; try{ S=Object.assign({rec:0,xp:0,moedas:40,som:true,jogos:0}, JSON.parse(localStorage.getItem(SK)||'{}')); }catch(e){ S={rec:0,xp:0,moedas:40,som:true,jogos:0}; }
const salvar=()=>{ try{ localStorage.setItem(SK,JSON.stringify(S)); }catch(e){} };
const nivel=()=>Math.floor(Math.sqrt(S.xp/150))+1;
const xpNivel=n=>(n-1)*(n-1)*150;

// ---------- Som ----------
const Som={ ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tom(f,d=.1,tipo='sine',vol=.08,q=0,f2){ if(!S.som||!this.ctx) return; const c=this.ctx,t=c.currentTime+q,o=c.createOscillator(),g=c.createGain();
    o.type=tipo; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f2||f*1.2,t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02); },
  sel(){ this.tom(660,.08,'triangle',.07,0,880); }, pulo(i){ this.tom(300+i*25,.05,'triangle',.04); }, erro(){ this.tom(180,.15,'square',.05,0,120); },
  nasce(){ this.tom(520,.12,'sine',.05,0,780); },
  linha(n,c){ [0,1,2,3].forEach(k=>this.tom(523*Math.pow(1.26,k+(n-5)*.5+c),.18,'triangle',.08,k*.06)); },
  boom(){ this.tom(90,.4,'sawtooth',.12,0,40); }, moeda(){ this.tom(990,.07,'square',.04); this.tom(1320,.08,'square',.04,.06); },
  fim(){ [392,330,262,196].forEach((f,i)=>this.tom(f,.3,'triangle',.08,i*.18)); }
};
const vibrar=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };

// ---------- Estado ----------
let grade, prox, proxPos, pts, sel, ocupado=false, modoBomba=false, historico=[], seq=0, linhasTotal=0, missoes=[], fim=false;
const MISSOES=[
  { id:'l3',   txt:'Forme 3 linhas',               ok:e=>e.linhasTot>=3 },
  { id:'l6',   txt:'Faça uma linha de 6+',         ok:e=>e.maior>=6 },
  { id:'dup',  txt:'Limpe 2 linhas numa jogada',   ok:e=>e.multi>=2 },
  { id:'seq',  txt:'Limpe em 2 jogadas seguidas',  ok:e=>e.seq>=2 },
  { id:'p200', txt:'Faça 200 pontos',              ok:e=>e.pts>=200 },
  { id:'diag', txt:'Forme uma linha diagonal',     ok:e=>e.diag },
  { id:'cor',  txt:'Use um coringa numa linha',    ok:e=>e.coringa },
  { id:'l10',  txt:'Forme 10 linhas',              ok:e=>e.linhasTot>=10 },
];
let ev;

// ---------- Three.js ----------
const renderer=new THREE.WebGLRenderer({canvas:$('cena'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
const cena=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,.1,100);
cena.add(new THREE.HemisphereLight(0xbfd8ff,0x1a2340,.55));
const sol=new THREE.DirectionalLight(0xffffff,1.1); sol.position.set(4,12,6); sol.castShadow=true; sol.shadow.mapSize.set(1024,1024);
Object.assign(sol.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:30}); sol.shadow.radius=4; cena.add(sol);
const rim=new THREE.PointLight(0x7b5cff,1.2,30); rim.position.set(-6,4,-6); cena.add(rim);
const rim2=new THREE.PointLight(0x1fb5ff,.8,30); rim2.position.set(6,3,-6); cena.add(rim2);

// tabuleiro
const tab=new THREE.Group(); cena.add(tab);
const base=new THREE.Mesh(new THREE.BoxGeometry(N+.9,.5,N+.9), new THREE.MeshStandardMaterial({color:0x1a2a5a,roughness:.35,metalness:.4}));
base.position.y=-.3; base.receiveShadow=true; tab.add(base);
const borda=new THREE.Mesh(new THREE.BoxGeometry(N+1.3,.3,N+1.3), new THREE.MeshStandardMaterial({color:0x0e1838,roughness:.5,metalness:.6}));
borda.position.y=-.55; tab.add(borda);
// moldura neon
const neon=new THREE.Mesh(new THREE.TorusGeometry(1,.035,8,64), new THREE.MeshBasicMaterial({color:0x46a8ff}));
neon.scale.set((N+.9)/2*1.42,(N+.9)/2*1.42,1); neon.rotation.x=-Math.PI/2; neon.rotation.z=Math.PI/4; neon.position.y=-.04; neon.visible=false;
const celulas=[], posCel=i=>new THREE.Vector3((i%N)-(N-1)/2, 0, Math.floor(i/N)-(N-1)/2);
const geoCel=new THREE.BoxGeometry(.92,.1,.92);
for(let i=0;i<N*N;i++){
  const escura=((i%N)+Math.floor(i/N))%2;
  const m=new THREE.Mesh(geoCel, new THREE.MeshStandardMaterial({color:escura?0x0f1d45:0x162a5c,roughness:.3,metalness:.2,emissive:0x000000}));
  m.position.copy(posCel(i)); m.position.y=-.05; m.receiveShadow=true; m.userData.i=i; tab.add(m); celulas.push(m);
}
// bolas
const geoBola=new THREE.SphereGeometry(.38,40,28);
function texArco(){ const c=document.createElement('canvas'); c.width=256; c.height=128; const g=c.getContext('2d');
  CORES.forEach((cor,k)=>{ g.fillStyle=cor; g.fillRect(k*256/7,0,256/7+1,128); }); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }
const lin=c=>new THREE.Color(c).convertSRGBToLinear();
const MATS=CORES.map(c=>new THREE.MeshPhysicalMaterial({color:lin(c),roughness:.18,metalness:0,clearcoat:1,clearcoatRoughness:.06,emissive:lin(c),emissiveIntensity:.12}));
MATS[CORINGA]=new THREE.MeshPhysicalMaterial({map:texArco(),roughness:.1,clearcoat:1,emissive:0xffffff,emissiveIntensity:.12});
const bolas=new Array(N*N).fill(null);
const fantasmas=[];
function criaBola(i,cor,escala=1){ const m=new THREE.Mesh(geoBola,MATS[cor]); m.castShadow=true; m.position.copy(posCel(i)); m.position.y=.38; m.scale.setScalar(escala); tab.add(m); return m; }

// partículas
const parts=[];
const geoPart=new THREE.SphereGeometry(.07,8,6);
function explosao(pos,cor,n=18){
  for(let k=0;k<n;k++){ const m=new THREE.Mesh(geoPart,new THREE.MeshBasicMaterial({color:cor,transparent:true}));
    m.position.copy(pos); const a=Math.random()*Math.PI*2, v=2+Math.random()*4;
    m.userData={vx:Math.cos(a)*v, vy:3+Math.random()*4, vz:Math.sin(a)*v, vida:.9}; cena.add(m); parts.push(m); }
  const anel=new THREE.Mesh(new THREE.RingGeometry(.3,.4,32), new THREE.MeshBasicMaterial({color:cor,transparent:true,side:THREE.DoubleSide}));
  anel.rotation.x=-Math.PI/2; anel.position.copy(pos); anel.position.y=.05; anel.userData={anel:true,vida:.6}; cena.add(anel); parts.push(anel);
}
function atualizaParts(dt){
  for(let k=parts.length-1;k>=0;k--){ const m=parts[k], u=m.userData; u.vida-=dt;
    if(u.anel){ const s=1+(.6-u.vida)*9; m.scale.set(s,s,s); m.material.opacity=Math.max(0,u.vida/.6); }
    else { u.vy-=12*dt; m.position.x+=u.vx*dt; m.position.y+=u.vy*dt; m.position.z+=u.vz*dt; m.material.opacity=Math.max(0,u.vida/.9); }
    if(u.vida<=0){ cena.remove(m); m.material.dispose(); if(u.anel) m.geometry.dispose(); parts.splice(k,1); } }
}

// tweens
const tweens=[];
function tween(dur,fn,fim){ return new Promise(r=>tweens.push({t:0,dur,fn,fim:()=>{ fim&&fim(); r(); }})); }
function atualizaTweens(dt){ for(let k=tweens.length-1;k>=0;k--){ const w=tweens[k]; w.t+=dt; const p=Math.min(1,w.t/w.dur); w.fn(p); if(p>=1){ tweens.splice(k,1); w.fim(); } } }
const elastico=p=>p===1?1:Math.pow(2,-10*p)*Math.sin((p-.075)*(2*Math.PI)/.3)+1;
const espera=ms=>new Promise(r=>setTimeout(r,ms));

// câmera responsiva
// Enquadra o tabuleiro no espaço livre entre o topo e os botões, em qualquer tela
function enquadrar(cam, renderer, alvo, semiX, semiZ, yMin, yMax, elev, folga){
  const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.clearViewOffset();
  const hud=document.querySelector('.hud').getBoundingClientRect(), base=document.querySelector('.base').getBoundingClientRect();
  let L=8, R=w-8, T=hud.bottom+6, B=h-8;
  if(base.width < w*.5){ R=Math.min(R, base.left-8); } else { B=Math.min(B, base.top-6); }
  if(base.width < w*.5 && hud.width < w*.6){ T=8; L=Math.max(L, hud.right+8); }
  const aw=Math.max(60,R-L), ah=Math.max(60,B-T), acx=(L+R)/2, acy=(T+B)/2;
  const dir=new THREE.Vector3(0, Math.sin(elev), Math.cos(elev));
  const cantos=[]; for(const x of [-semiX,semiX]) for(const y of [yMin,yMax]) for(const z of [-semiZ,semiZ]) cantos.push(new THREE.Vector3(alvo.x+x, y, alvo.z+z));
  const caixa=()=>{ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; const v=new THREE.Vector3();
    for(const c of cantos){ v.copy(c).project(cam); const px=(v.x+1)/2*w, py=(1-v.y)/2*h; x0=Math.min(x0,px); x1=Math.max(x1,px); y0=Math.min(y0,py); y1=Math.max(y1,py); }
    return {x0,x1,y0,y1}; };
  let D=20;
  for(let k=0;k<8;k++){
    cam.position.copy(alvo).addScaledVector(dir,D); cam.lookAt(alvo); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
    const b=caixa(); const s=Math.max((b.x1-b.x0)/(aw*folga), (b.y1-b.y0)/(ah*folga)); D*=s; if(Math.abs(s-1)<.01) break;
  }
  cam.position.copy(alvo).addScaledVector(dir,D); cam.lookAt(alvo); cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  const b=caixa(); cam.setViewOffset(w,h,(b.x0+b.x1)/2-acx,(b.y0+b.y1)/2-acy,w,h); cam.updateProjectionMatrix();
}
function pontoNDC(e, canvas, ptr){ const r=canvas.getBoundingClientRect(); ptr.x=(e.clientX-r.left)/r.width*2-1; ptr.y=-((e.clientY-r.top)/r.height)*2+1; }
function ajusta(){ enquadrar(cam, renderer, new THREE.Vector3(0,0,0), (N+1.3)/2, (N+1.3)/2, -.7, .9, 1.13, .97); }
addEventListener('resize',ajusta); if(window.visualViewport) visualViewport.addEventListener('resize',ajusta); ajusta();

// ---------- Regras ----------
function vazias(){ const v=[]; for(let i=0;i<N*N;i++) if(grade[i]<0) v.push(i); return v; }
function sorteiaCor(){ return Math.random()<.04 ? CORINGA : Math.floor(Math.random()*CORES.length); }
function sorteiaProx(){
  prox=[sorteiaCor(),sorteiaCor(),sorteiaCor()];
  const v=vazias(); proxPos=[];
  for(let k=0;k<3&&v.length;k++){ const j=Math.floor(Math.random()*v.length); proxPos.push(v.splice(j,1)[0]); }
  desenhaFantasmas(); hudProx();
}
function desenhaFantasmas(){
  fantasmas.forEach(f=>tab.remove(f)); fantasmas.length=0;
  proxPos.forEach((i,k)=>{ const m=criaBola(i,prox[k],.3); m.castShadow=false; m.material=MATS[prox[k]].clone(); m.material.transparent=true; m.material.opacity=.7; m.position.y=.15; fantasmas.push(m); });
}
function caminho(a,b){
  const ant=new Array(N*N).fill(-2); ant[a]=-1; const fila=[a];
  while(fila.length){ const k=fila.shift(); if(k===b) break; const x=k%N,y=(k/N)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=N||ny>=N) continue; const n=ny*N+nx;
      if(ant[n]===-2 && grade[n]<0){ ant[n]=k; fila.push(n); } } }
  if(ant[b]===-2) return null; const p=[]; for(let k=b;k!==-1;k=ant[k]) p.unshift(k); return p;
}
// linhas que passam por i (coringa combina com qualquer cor)
function linhasEm(i){
  const res=[]; const x0=i%N, y0=(i/N)|0;
  for(const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){
    const cand = grade[i]===CORINGA ? [...Array(CORES.length).keys()] : [grade[i]];
    let melhor=null;
    for(const c of cand){
      const cel=[i]; const ok=k=>grade[k]===c||grade[k]===CORINGA;
      for(const s of [1,-1]){ let x=x0+dx*s, y=y0+dy*s; while(x>=0&&y>=0&&x<N&&y<N&&ok(y*N+x)){ cel.push(y*N+x); x+=dx*s; y+=dy*s; } }
      if(cel.length>=5 && (!melhor||cel.length>melhor.cel.length) && cel.some(k=>grade[k]!==CORINGA)) melhor={cel,c,diag:dx!==0&&dy!==0};
    }
    if(melhor) res.push(melhor);
  }
  return res;
}
async function limpar(origens){
  const linhas=[]; const vistos=new Set();
  for(const i of origens) if(grade[i]>=0) for(const l of linhasEm(i)){ const ch=[...l.cel].sort((a,b)=>a-b).join(','); if(!vistos.has(ch)){ vistos.add(ch); linhas.push(l); } }
  if(!linhas.length) return 0;
  const todas=new Set(); let ganho=0, usouCoringa=false;
  for(const l of linhas){ ganho+=10+2*(l.cel.length-5); l.cel.forEach(k=>{ todas.add(k); if(grade[k]===CORINGA) usouCoringa=true; });
    ev.maior=Math.max(ev.maior,l.cel.length); if(l.diag) ev.diag=true; }
  if(linhas.length>1) ganho*=linhas.length;              // combo de linhas
  seq++; if(seq>1) ganho+=5*(seq-1);                     // sequência de jogadas
  ev.linhasTot+=linhas.length; ev.multi=Math.max(ev.multi,linhas.length); ev.seq=Math.max(ev.seq,seq); if(usouCoringa) ev.coringa=true;
  Som.linha(linhas[0].cel.length, seq-1); vibrar([20,30,40]);
  // animação: brilho, cresce e explode
  const lista=[...todas];
  await tween(.18,p=>lista.forEach(k=>{ const b=bolas[k]; if(b){ b.scale.setScalar(1+p*.35); b.position.y=.38+p*.3; } }));
  lista.forEach((k,j)=>{ const b=bolas[k]; if(!b) return; const cor=grade[k]===CORINGA?0xffffff:new THREE.Color(CORES[grade[k]]);
    setTimeout(()=>{ explosao(b.position.clone(),cor,14); tab.remove(b); },j*35); bolas[k]=null; grade[k]=-1; });
  await espera(lista.length*35+80);
  const centro=new THREE.Vector3(); lista.forEach(k=>centro.add(posCel(k))); centro.divideScalar(lista.length);
  voo('+'+ganho, centro, linhas[0].c);
  if(linhas.length>1) grito(linhas.length===2?'COMBO x2!':'MEGA COMBO!'); else if(seq>=3) grito('Sequência x'+seq+'!'); else if(lista.length>=7) grito('Incrível!');
  pts+=ganho; hud(); checaMissoes();
  return ganho;
}
async function nascer(){
  const v=vazias();
  // se o jogador ocupou uma posição prevista, sorteia outra
  const pos=proxPos.map(i=>{ if(grade[i]<0) return i; const livre=v.filter(k=>!proxPos.includes(k)); return livre.length?livre[Math.floor(Math.random()*livre.length)]:-1; });
  fantasmas.forEach(f=>tab.remove(f)); fantasmas.length=0;
  const novas=[];
  pos.forEach((i,k)=>{ if(i<0||grade[i]>=0) return; grade[i]=prox[k]; const b=criaBola(i,prox[k],.01); bolas[i]=b; novas.push(i); });
  Som.nasce();
  await tween(.45,p=>novas.forEach(i=>{ const e=elastico(p); bolas[i].scale.setScalar(Math.max(.01,e)); }));
  await limpar(novas);
  if(!vazias().length){ return fimDeJogo(); }
  sorteiaProx();
}

// ---------- Jogada ----------
function selecionar(i){
  if(sel!==null && bolas[sel]){ const b=bolas[sel]; b.position.y=.38; b.scale.setScalar(1); }
  sel=i; celulas.forEach(c=>c.material.emissive.setHex(0));
  if(i!==null){ celulas[i].material.emissive.setHex(0x3355aa); Som.sel(); vibrar(8); }
}
async function mover(a,b){
  const p=caminho(a,b);
  if(!p){ Som.erro(); vibrar([30,20,30]); piscaCelula(b,0xaa2233); toast('Sem caminho livre até lá'); return; }
  ocupado=true; salvarHistorico();
  const bola=bolas[a]; selecionar(null); sel=null;
  // destaca o caminho
  p.forEach((k,j)=>setTimeout(()=>piscaCelula(k,0x2a7a5a,160),j*40));
  for(let j=1;j<p.length;j++){
    const de=posCel(p[j-1]), para=posCel(p[j]); Som.pulo(j);
    await tween(.075,t=>{ bola.position.x=de.x+(para.x-de.x)*t; bola.position.z=de.z+(para.z-de.z)*t; bola.position.y=.38+Math.sin(t*Math.PI)*.35; });
  }
  bola.position.y=.38;
  grade[b]=grade[a]; grade[a]=-1; bolas[b]=bola; bolas[a]=null;
  await tween(.15,t=>{ const s=1+Math.sin(t*Math.PI)*.18; bola.scale.set(s,2-s,s); });
  bola.scale.setScalar(1);
  const g=await limpar([b]);
  if(!g){ seq=0; await nascer(); } else if(!vazias().length) fimDeJogo();
  hud(); ocupado=false;
}
function piscaCelula(i,cor,ms=300){ const m=celulas[i].material; m.emissive.setHex(cor); setTimeout(()=>{ if(i!==sel) m.emissive.setHex(0); },ms); }
async function bombardear(i){
  if(grade[i]<0){ toast('Toque numa bola para explodir'); return; }
  S.moedas-=PRECO.bomba; salvar(); salvarHistorico(); modoBomba=false; $('b-bomba').classList.remove('ativo');
  const b=bolas[i], cor=grade[i]===CORINGA?0xffffff:new THREE.Color(CORES[grade[i]]);
  Som.boom(); vibrar([40,30,60]); explosao(b.position.clone(),cor,30); tab.remove(b); bolas[i]=null; grade[i]=-1; hud();
}

// ---------- Desfazer ----------
function salvarHistorico(){ historico=[{ grade:[...grade], prox:[...prox], proxPos:[...proxPos], pts, seq }]; }
function desfazer(){
  if(ocupado||fim) return; if(!historico.length){ toast('Nada para desfazer'); return; }
  if(S.moedas<PRECO.desf){ toast('Moedas insuficientes'); Som.erro(); return; }
  S.moedas-=PRECO.desf; salvar();
  const h=historico.pop(); grade=h.grade; prox=h.prox; proxPos=h.proxPos; pts=h.pts; seq=h.seq;
  reconstruir(); desenhaFantasmas(); hudProx(); hud(); Som.tom(500,.12,'sine',.06,0,300); toast('↩️ Jogada desfeita');
}
function reconstruir(){ bolas.forEach((b,i)=>{ if(b) tab.remove(b); bolas[i]=null; }); grade.forEach((c,i)=>{ if(c>=0) bolas[i]=criaBola(i,c); }); selecionar(null); sel=null; }

// ---------- Interface ----------
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
$('cena').addEventListener('pointerdown',e=>{
  Som.init(); if(ocupado||fim||!$('modal').hidden) return;
  pontoNDC(e,$('cena'),ptr); ray.setFromCamera(ptr,cam);
  const alvos=[...celulas,...bolas.filter(Boolean)]; const hit=ray.intersectObjects(alvos)[0]; if(!hit) return;
  let i=hit.object.userData.i; if(i===undefined) i=bolas.indexOf(hit.object); if(i<0) return;
  if(modoBomba) return bombardear(i);
  if(grade[i]>=0){ selecionar(sel===i?null:i); return; }
  if(sel!==null) mover(sel,i);
});
function hud(){
  $('h-pts').textContent=fmt(pts); $('h-rec').textContent='🏆 '+fmt(Math.max(S.rec,pts)); $('h-moe').textContent='🪙 '+fmt(S.moedas);
  const n=nivel(); $('h-niv').textContent='Nv '+n; $('h-xp').style.width=Math.min(100,(S.xp+pts-xpNivel(n))/(xpNivel(n+1)-xpNivel(n))*100)+'%';
  $('h-som').textContent=S.som?'🔊':'🔇';
  $('b-desf').style.opacity=S.moedas>=PRECO.desf&&historico.length?1:.5; $('b-bomba').style.opacity=S.moedas>=PRECO.bomba?1:.5;
}
function hudProx(){ prox.forEach((c,k)=>{ $('p'+k).style.background = c===CORINGA ? 'conic-gradient('+CORES.join(',')+','+CORES[0]+')' : `radial-gradient(circle at 35% 30%, #fff8, ${CORES[c]} 45%)`; }); }
function hudMis(){ $('h-mis').innerHTML=missoes.map(m=>`<span class="mis ${m.feita?'ok':''}">${m.feita?'✓':'🎯'} ${m.txt}</span>`).join(''); }
function checaMissoes(){ ev.pts=pts; missoes.forEach(m=>{ if(!m.feita && m.ok(ev)){ m.feita=true; S.moedas+=20; salvar(); Som.moeda(); toast(`🎯 Missão cumprida! +20 🪙`); hudMis(); hud(); } }); }
let toastT; function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('on'),1800); }
function grito(t){ const g=document.createElement('div'); g.className='grito'; g.textContent=t; document.body.appendChild(g); setTimeout(()=>g.remove(),1200); }
function voo(txt,pos3,cor){ const v=pos3.clone(); v.y=.8; tab.localToWorld(v); v.project(cam);
  const d=document.createElement('div'); d.className='voo'; d.textContent=txt; d.style.color=CORES[cor]||'#fff';
  d.style.left=((v.x+1)/2*innerWidth)+'px'; d.style.top=((1-v.y)/2*innerHeight)+'px'; $('voos').appendChild(d); setTimeout(()=>d.remove(),1100); }
function modal(h){ $('mbox').innerHTML=h; $('modal').hidden=false; }
function fechar(){ $('modal').hidden=true; }

function novoJogo(){
  fechar(); fim=false; ocupado=false; modoBomba=false; $('b-bomba').classList.remove('ativo');
  bolas.forEach(b=>b&&tab.remove(b)); bolas.fill(null);
  grade=new Array(N*N).fill(-1); pts=0; sel=null; seq=0; historico=[];
  ev={linhasTot:0,maior:0,multi:0,seq:0,pts:0,diag:false,coringa:false};
  const pool=[...MISSOES].sort(()=>Math.random()-.5); missoes=pool.slice(0,3).map(m=>({...m,feita:false}));
  const v=vazias(); for(let k=0;k<5;k++){ const j=Math.floor(Math.random()*v.length); const i=v.splice(j,1)[0]; grade[i]=Math.floor(Math.random()*CORES.length); bolas[i]=criaBola(i,grade[i]); }
  selecionar(null); sel=null; sorteiaProx(); hud(); hudMis();
}
function fimDeJogo(){
  if(fim) return; fim=true; ocupado=false; Som.fim(); vibrar([60,40,60]);
  const rec=pts>S.rec; if(rec) S.rec=pts;
  const ganhou=Math.floor(pts/10); const nAntes=nivel(); S.xp+=pts; S.moedas+=ganhou; S.jogos++; salvar();
  const subiu=nivel()>nAntes;
  setTimeout(()=>{ modal(`<h2>Tabuleiro cheio!</h2><div class="grande">${fmt(pts)}</div>
    <p>${rec?'🏆 Novo recorde!':'Recorde: '+fmt(S.rec)}</p>${subiu?`<p>⭐ Você subiu para o nível ${nivel()}!</p>`:''}
    <span class="moedas">+${ganhou} 🪙</span>
    <div class="lmis">${missoes.map(m=>`<div>${m.feita?'✅':'⬜'} ${m.txt}</div>`).join('')}</div>
    <button class="btn verde" id="m-novo">Jogar de novo</button><button class="btn" id="m-des">Desafiar um amigo</button><button class="btn sec" id="m-sair">Voltar aos jogos</button>`);
    $('m-novo').onclick=novoJogo; $('m-sair').onclick=()=>location.href='../index.html';
    $('m-des').onclick=()=>{ const txt=`Fiz ${fmt(pts)} pontos no Linha de Cores 3D. Consegue passar?`, url=location.origin+location.pathname;
      if(navigator.share) navigator.share({text:txt,url}).catch(()=>{}); else window.open('https://wa.me/?text='+encodeURIComponent(txt+'\n'+url),'_blank'); };
    hud(); },700);
}
function menu(){
  modal(`<h2>Linha de Cores 3D</h2><ul class="regras">
    <li>Toque numa bola e depois numa casa vazia: ela vai até lá se houver <b>caminho livre</b>.</li>
    <li>Alinhe <b>5 ou mais</b> da mesma cor na horizontal, vertical ou diagonal para estourar.</li>
    <li>Estourou? Ganha uma jogada extra. Não estourou? Nascem <b>3 bolas</b> (as bolinhas transparentes mostram onde).</li>
    <li>🌈 O <b>coringa</b> combina com qualquer cor.</li>
    <li>Duas linhas de uma vez valem em dobro. Jogadas seguidas dão bônus.</li></ul>
    <button class="btn verde" id="m-cont">Continuar</button><button class="btn" id="m-novo">Novo jogo</button><button class="btn sec" id="m-sair">Voltar aos jogos</button>`);
  $('m-cont').onclick=fechar; $('m-novo').onclick=novoJogo; $('m-sair').onclick=()=>location.href='../index.html';
}
$('b-desf').onclick=desfazer;
$('b-bomba').onclick=()=>{ if(ocupado||fim) return; if(modoBomba){ modoBomba=false; $('b-bomba').classList.remove('ativo'); return; }
  if(S.moedas<PRECO.bomba){ toast('Moedas insuficientes'); Som.erro(); return; } modoBomba=true; $('b-bomba').classList.add('ativo'); toast('Toque na bola que quer explodir'); };
$('b-menu').onclick=menu;
$('h-som').onclick=()=>{ S.som=!S.som; salvar(); hud(); };
$('rodape').textContent=`${CONFIG.SISTEMA} v${CONFIG.VERSAO}•Desenvolvido por ${CONFIG.DESENVOLVEDOR}`;

// ---------- Loop ----------
let ult=performance.now(), tempo=0;
function quadro(t){
  const dt=Math.min(.05,(t-ult)/1000); ult=t; tempo+=dt;
  atualizaTweens(dt); atualizaParts(dt);
  if(sel!==null && bolas[sel] && !ocupado){ const b=bolas[sel]; const s=Math.abs(Math.sin(tempo*7)); b.position.y=.38+s*.45; b.scale.set(1+(1-s)*.08,1-(1-s)*.1,1+(1-s)*.08); b.rotation.y+=dt*3; }
  fantasmas.forEach((f,k)=>{ f.position.y=.15+Math.sin(tempo*3+k)*.04; });
  rim.position.x=Math.sin(tempo*.4)*7; rim2.position.z=Math.cos(tempo*.3)*7-2;
  renderer.render(cena,cam); requestAnimationFrame(quadro);
}
novoJogo(); requestAnimationFrame(quadro);
if(!S.jogos) menu();
</script>
