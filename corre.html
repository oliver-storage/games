<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calu Corre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="core.js"></script>
<script>
// Personagem original: Calu, o calango laranja de bandana
function desenhaCalu(ctx, x, y, t, noChao, ouro){
  ctx.save(); ctx.translate(x, y);
  const p = noChao ? Math.sin(t*22)*5 : 3;
  ctx.lineCap='round';
  // rabo
  ctx.strokeStyle='#e07a1f'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(-14,-14); ctx.quadraticCurveTo(-34,-12,-44,-4+Math.sin(t*12)*4); ctx.stroke();
  // patas
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(-6,-8); ctx.lineTo(-10+p,0); ctx.moveTo(8,-8); ctx.lineTo(12-p,0); ctx.stroke();
  // corpo
  ctx.fillStyle='#f39c34'; ctx.beginPath(); ctx.ellipse(0,-16,18,11,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd18a'; ctx.beginPath(); ctx.ellipse(3,-11,12,5,0,0,Math.PI*2); ctx.fill();
  // pintinhas
  ctx.fillStyle='#d9701a'; [[-8,-21],[0,-24],[-2,-18]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,2.2,0,Math.PI*2);ctx.fill();});
  // cabeça
  ctx.fillStyle='#f39c34'; ctx.beginPath(); ctx.ellipse(19,-29,13,9,-0.2,0,Math.PI*2); ctx.fill();
  // bandana
  ctx.fillStyle = ouro ? '#f5b301' : '#1e4fd8';
  ctx.beginPath(); ctx.ellipse(10,-24,5,7,0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7,-25); ctx.lineTo(-4,-33+Math.sin(t*16)*3); ctx.lineTo(-2,-23); ctx.fill();
  // olho e sorriso
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(23,-32,4.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(24.5,-32,2.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7a3e0c'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(26,-27,4,0.2,1.3); ctx.stroke();
  ctx.restore();
}

Motor({
  id:'calu', nome:'Calu Corre', titulo:'CALU <span>CORRE</span>', meta:1500,
  regras:'O Calu corre sozinho pelo sertão. <b>Toque na tela para pular</b> (dá pra pular 2 vezes no ar). Desvie dos cactos e pedras e pegue as castanhas.',
  iniciar({ seed, area, ouro, fim }){
    const { cv, ctx, W, H } = criaCanvas(area);
    const r = rng(seed);
    const CHAO = H-90, G = 1900, PULO = -660;
    const calu = { x:80, y:CHAO, vy:0, pulos:0 };
    let vel=250, dist=0, cast=0, obs=[], itens=[], prox=1.3, t=0, morto=false;

    const pular = () => { if (morto) return; if (calu.pulos<2){ calu.vy=PULO; calu.pulos++; vibrar(8); } };
    const tp = e => { e.preventDefault(); pular(); };
    const kb = e => { if (e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); pular(); } };
    cv.addEventListener('pointerdown', tp);
    addEventListener('keydown', kb);

    function gerar(){
      const cacto = r()<0.65;
      const h = cacto ? 38+r()*32 : 24, w = cacto ? 24 : 36;
      obs.push({ x:W+20, w, h, cacto });
      if (r()<0.6){
        const n=2+Math.floor(r()*3), alt=CHAO-70-r()*100;
        for (let i=0;i<n;i++) itens.push({ x:W+130+i*30, y:alt, ok:false });
      }
      prox = Math.max(0.5, 1.4-vel/900) + r()*0.8;
    }
    const pontos = () => Math.floor(dist/10) + cast*20;

    function upd(dt){
      if (morto) return;
      t+=dt; vel=Math.min(640, 250+t*6); dist+=vel*dt;
      calu.vy+=G*dt; calu.y+=calu.vy*dt;
      if (calu.y>=CHAO){ calu.y=CHAO; calu.vy=0; calu.pulos=0; }
      prox-=dt; if (prox<=0) gerar();
      obs.forEach(o=>o.x-=vel*dt); itens.forEach(c=>c.x-=vel*dt);
      obs = obs.filter(o=>o.x>-60); itens = itens.filter(c=>c.x>-20 && !c.ok);
      for (const o of obs){
        if (calu.x+16>o.x+5 && calu.x-12<o.x+o.w-5 && calu.y>CHAO-o.h+6){ morrer(); return; }
      }
      for (const c of itens){
        if (Math.abs(c.x-calu.x)<24 && Math.abs(c.y-(calu.y-20))<28){ c.ok=true; cast++; vibrar(6); }
      }
    }
    function morrer(){
      morto=true; vibrar([60,40,60]);
      cv.removeEventListener('pointerdown', tp); removeEventListener('keydown', kb);
      setTimeout(()=>{ parar(); fim(pontos()); }, 900);
    }
    function cacto(o){
      const x=o.x, b=CHAO, h=o.h, w=o.w;
      ctx.fillStyle='#2f8f46';
      ctx.beginPath(); ctx.roundRect(x+w/2-7, b-h, 14, h, 7); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x, b-h*0.65, 8, h*0.35, 4); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x, b-h*0.4, w/2, 7, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x+w-8, b-h*0.8, 8, h*0.4, 4); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x+w/2, b-h*0.5, w/2, 7, 3); ctx.fill();
    }
    function draw(){
      // céu de fim de tarde
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2b3a8c'); g.addColorStop(0.55,'#f08a4b'); g.addColorStop(1,'#f6c26b');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffe29a'; ctx.beginPath(); ctx.arc(270,190,38,0,Math.PI*2); ctx.fill();
      // serras ao fundo (parallax)
      ctx.fillStyle='#b8613a';
      const s1 = (dist*0.15)%240;
      for (let i=-1;i<4;i++){ const bx=i*240-s1; ctx.beginPath(); ctx.moveTo(bx,CHAO); ctx.lineTo(bx+120,CHAO-130); ctx.lineTo(bx+240,CHAO); ctx.fill(); }
      ctx.fillStyle='#9a4a2a';
      const s2 = (dist*0.3)%180;
      for (let i=-1;i<4;i++){ const bx=i*180-s2; ctx.beginPath(); ctx.moveTo(bx,CHAO); ctx.lineTo(bx+90,CHAO-70); ctx.lineTo(bx+180,CHAO); ctx.fill(); }
      // chão
      ctx.fillStyle='#d9a066'; ctx.fillRect(0,CHAO,W,H-CHAO);
      ctx.fillStyle='#c48a52';
      const s3 = dist%40; for (let x=-s3;x<W;x+=40) ctx.fillRect(x,CHAO+14,18,4);
      // castanhas
      itens.forEach(c=>{ ctx.fillStyle='#8a4b1f'; ctx.beginPath(); ctx.ellipse(c.x,c.y,8,6,0.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#c97b3c'; ctx.beginPath(); ctx.arc(c.x-2,c.y-2,2.5,0,Math.PI*2); ctx.fill(); });
      // obstáculos
      obs.forEach(o=>{
        if (o.cacto) cacto(o);
        else { ctx.fillStyle='#6b6f7a'; ctx.beginPath(); ctx.ellipse(o.x+o.w/2,CHAO-10,o.w/2,14,0,Math.PI,0); ctx.fill(); ctx.fillRect(o.x,CHAO-10,o.w,10); }
      });
      // Calu
      ctx.save();
      if (morto){ ctx.translate(calu.x, calu.y); ctx.rotate(-0.5); ctx.translate(-calu.x, -calu.y); }
      desenhaCalu(ctx, calu.x, calu.y, t, calu.y>=CHAO, ouro);
      ctx.restore();
      // HUD
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(10,10,W-20,40,12); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 20px system-ui'; ctx.textAlign='left'; ctx.fillText(fmt(pontos())+' pts',22,37);
      ctx.textAlign='right'; ctx.fillText('🌰 '+cast, W-22, 37);
      if (t<2.5){ ctx.textAlign='center'; ctx.font='bold 22px system-ui'; ctx.fillText('Toque para pular!', W/2, 130); }
      if (morto){ ctx.textAlign='center'; ctx.font='900 44px system-ui'; ctx.fillText('OPS!', W/2, H/2-40); }
    }
    const parar = loop(upd, draw);
  }
});
</script>
</body>
</html>
