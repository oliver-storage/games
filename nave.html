<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chuva de Meteoros</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="core.js"></script>
<script>
Motor({
  id:'nave', nome:'Chuva de Meteoros', titulo:'CHUVA DE <span>METEOROS</span>', meta:2500,
  regras:'<b>Arraste o dedo</b> para mover a nave; ela atira sozinha. Destrua os meteoros e não deixe eles te acertarem. Aos 45 segundos chega o <b>Rochedão</b>. 3 vidas, 60 segundos.',
  iniciar({ seed, area, ouro, fim }){
    const { cv, ctx, W, H, ponto } = criaCanvas(area);
    const r = rng(seed), DUR=60, CHEFE_EM=45;
    const nave = { x:W/2, y:H-70, alvo:W/2 };
    let tiros=[], mets=[], parts=[], t=0, cd=0, prox=0.8, vidas=3, pts=0, inv=0, chefe=null, chefeFeito=false, acabou=false, kdir=0;
    const estrelas = Array.from({length:60}, () => ({ x:Math.random()*W, y:Math.random()*H, v:20+Math.random()*70, s:Math.random()*1.8+0.4 }));

    const mv = e => { e.preventDefault(); nave.alvo = Math.max(20, Math.min(W-20, ponto(e).x)); };
    const kd = e => { if (e.code==='ArrowLeft') kdir=-1; if (e.code==='ArrowRight') kdir=1; };
    const ku = e => { if (e.code==='ArrowLeft'&&kdir<0 || e.code==='ArrowRight'&&kdir>0) kdir=0; };
    cv.addEventListener('pointerdown', mv); cv.addEventListener('pointermove', mv);
    addEventListener('keydown', kd); addEventListener('keyup', ku);

    function explode(x, y, n, cor){ for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=40+Math.random()*160; parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, vida:0.6, cor }); } }
    function encerrar(){
      if (acabou) return; acabou=true;
      cv.removeEventListener('pointerdown', mv); cv.removeEventListener('pointermove', mv);
      removeEventListener('keydown', kd); removeEventListener('keyup', ku);
      setTimeout(()=>{ parar(); fim(pts); }, 1000);
    }
    function upd(dt){
      parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vida-=dt; }); parts=parts.filter(p=>p.vida>0);
      estrelas.forEach(s=>{ s.y+=s.v*dt; if (s.y>H){ s.y=0; s.x=Math.random()*W; } });
      if (acabou) return;
      t+=dt;
      if (kdir) nave.alvo = Math.max(20, Math.min(W-20, nave.alvo+kdir*360*dt));
      nave.x += (nave.alvo-nave.x)*Math.min(1, dt*14);
      // tiro automático
      cd-=dt; if (cd<=0){ tiros.push({ x:nave.x, y:nave.y-22 }); cd=0.16; }
      tiros.forEach(s=>s.y-=540*dt); tiros=tiros.filter(s=>s.y>-10 && !s.usado);
      // meteoros
      if (t<CHEFE_EM){
        prox-=dt;
        if (prox<=0){
          const tam=1+Math.floor(r()*3);
          mets.push({ x:20+r()*(W-40), y:-30, r:9+tam*7, hp:tam, tam, v:80+r()*70+t*3, vx:(r()-0.5)*50, rot:r()*6 });
          prox = Math.max(0.26, 0.9-t*0.014) + r()*0.3;
        }
      } else if (!chefe && !chefeFeito){
        chefe = { x:W/2, y:-70, hp:45, max:45, dir:1, cd:1.2 };
      }
      mets.forEach(m=>{ m.y+=m.v*dt; m.x+=m.vx*dt; m.rot+=dt; });
      mets = mets.filter(m=>m.y<H+40 && !m.morto);
      // chefe
      if (chefe){
        chefe.y += (90-chefe.y)*Math.min(1,dt*2);
        chefe.x += chefe.dir*90*dt; if (chefe.x<60||chefe.x>W-60) chefe.dir*=-1;
        chefe.cd-=dt;
        if (chefe.cd<=0){ mets.push({ x:chefe.x, y:chefe.y+45, r:11, hp:1, tam:1, v:210, vx:(r()-0.5)*140, rot:0 }); chefe.cd=0.65; }
      }
      // colisões tiro x meteoro / chefe
      for (const s of tiros){
        for (const m of mets){
          if (!m.morto && Math.hypot(s.x-m.x, s.y-m.y)<m.r){ s.usado=true; m.hp--; if (m.hp<=0){ m.morto=true; pts+=m.tam*10; explode(m.x,m.y,10,'#e0a070'); } break; }
        }
        if (!s.usado && chefe && Math.hypot(s.x-chefe.x, s.y-chefe.y)<52){
          s.usado=true; chefe.hp--;
          if (chefe.hp<=0){
            explode(chefe.x,chefe.y,60,'#f5b301'); vibrar([80,40,80]);
            const bonus = 500 + Math.round((DUR-t)*15);
            pts+=bonus; popTxt('+'+fmt(bonus),'#f5b301');
            chefe=null; chefeFeito=true; encerrar(); return;
          }
        }
      }
      // nave atingida
      inv-=dt;
      if (inv<=0){
        for (const m of mets){
          if (!m.morto && Math.hypot(nave.x-m.x, nave.y-m.y)<m.r+12){
            m.morto=true; vidas--; inv=1.5; vibrar([60,40,60]); explode(nave.x,nave.y,20,'#ef4444');
            if (vidas<=0){ encerrar(); return; }
            break;
          }
        }
      }
      if (t>=DUR) encerrar();
    }
    function desenhaNave(){
      if (inv>0 && Math.floor(inv*10)%2===0 && !acabou) return;
      if (vidas<=0) return;
      const x=nave.x, y=nave.y, c = ouro ? '#f5b301' : '#4f7dff';
      ctx.fillStyle='#ff9b2f'; ctx.beginPath(); ctx.moveTo(x-7,y+16); ctx.lineTo(x,y+26+Math.random()*8); ctx.lineTo(x+7,y+16); ctx.fill();
      ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x,y-22); ctx.lineTo(x+18,y+16); ctx.lineTo(x,y+9); ctx.lineTo(x-18,y+16); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#bfe3ff'; ctx.beginPath(); ctx.ellipse(x,y-4,5,8,0,0,Math.PI*2); ctx.fill();
    }
    function desenhaMeteoro(m){
      ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rot);
      ctx.fillStyle='#8a6248'; ctx.beginPath();
      for (let i=0;i<8;i++){ const a=i/8*Math.PI*2, rr=m.r*(0.82+((i*37)%5)/25); ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#6b4a36'; ctx.beginPath(); ctx.arc(m.r*0.3,-m.r*0.2,m.r*0.25,0,Math.PI*2); ctx.arc(-m.r*0.3,m.r*0.3,m.r*0.18,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    function desenhaChefe(c){
      ctx.save(); ctx.translate(c.x,c.y);
      ctx.fillStyle='#6e4b3a'; ctx.beginPath();
      for (let i=0;i<12;i++){ const a=i/12*Math.PI*2, rr=55*(0.85+((i*53)%7)/30); ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill();
      // olhos bravos
      ctx.fillStyle='#ffdf6b'; ctx.beginPath(); ctx.arc(-18,-6,9,0,Math.PI*2); ctx.arc(18,-6,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-16,-4,4,0,Math.PI*2); ctx.arc(16,-4,4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#2a1a12'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-30,-20); ctx.lineTo(-8,-12); ctx.moveTo(30,-20); ctx.lineTo(8,-12); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,24,12,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      ctx.restore();
      // barra de vida
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(40,64,W-80,10);
      ctx.fillStyle='#ef4444'; ctx.fillRect(40,64,(W-80)*c.hp/c.max,10);
    }
    function draw(){
      ctx.fillStyle='#070b1f'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; estrelas.forEach(s=>{ ctx.globalAlpha=s.s/2.2; ctx.fillRect(s.x,s.y,s.s,s.s); }); ctx.globalAlpha=1;
      ctx.fillStyle='#ffe066'; tiros.forEach(s=>ctx.fillRect(s.x-2,s.y-8,4,12));
      mets.forEach(desenhaMeteoro);
      if (chefe) desenhaChefe(chefe);
      desenhaNave();
      parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.vida/0.6); ctx.fillStyle=p.cor; ctx.fillRect(p.x-2,p.y-2,4,4); }); ctx.globalAlpha=1;
      // HUD
      ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.roundRect(10,10,W-20,40,12); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 19px system-ui';
      ctx.textAlign='left'; ctx.fillText(fmt(pts)+' pts', 22, 37);
      ctx.textAlign='center'; ctx.fillText(Math.max(0,Math.ceil(DUR-t))+'s', W/2, 37);
      ctx.textAlign='right'; ctx.fillText('♥'.repeat(Math.max(0,vidas)), W-22, 37);
      ctx.textAlign='center';
      if (t<2.5){ ctx.font='bold 20px system-ui'; ctx.fillText('Arraste o dedo para mover', W/2, H/2); }
      if (t>=CHEFE_EM && t<CHEFE_EM+2 && !chefeFeito){ ctx.fillStyle='#ef4444'; ctx.font='900 30px system-ui'; ctx.fillText('ROCHEDÃO!', W/2, H/2); }
      if (acabou){ ctx.fillStyle='#fff'; ctx.font='900 38px system-ui'; ctx.fillText(chefeFeito ? 'VITÓRIA!' : vidas<=0 ? 'FIM!' : 'TEMPO!', W/2, H/2); }
    }
    const parar = loop(upd, draw);
  }
});
</script>
</body>
</html>
