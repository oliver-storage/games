<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdf3e7">
<title>Lar dos Gatinhos</title>
<style>
:root{--creme:#fdf3e7;--menta:#cdeee0;--rosa:#ffd9e4;--bege:#f3e3cc;--tiffany:#81d8d0;--tiffanyE:#4fb3aa;--ouro:#f2c14e;--madeira:#b98552;--madeiraE:#8a5a30;--txt:#5b4636}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:linear-gradient(180deg,#fdf3e7 0%,#ffe9ef 55%,#e3f6ee 100%);user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.app{max-width:480px;margin:0 auto;height:100dvh;position:relative;display:flex;flex-direction:column}
.tela{display:none;flex-direction:column;flex:1;min-height:0}
.tela.on{display:flex}
.topo{display:flex;align-items:center;gap:8px;padding:10px 12px}
.chip{background:#fff;border-radius:16px;padding:6px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(91,70,54,.12);white-space:nowrap;color:var(--txt);text-decoration:none}
.chip.ouro{color:#b07d10}
.titulo{flex:1;text-align:center;font-weight:900;font-size:19px}
/* casa */
.cena-casa{margin:0 12px;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 rgba(185,133,82,.25),0 0 0 6px #fff;position:relative;background:#fff}
#casa{display:block;width:100%;aspect-ratio:360/240}
.balao{position:absolute;left:12px;top:10px;max-width:70%;background:#fff;border-radius:14px;padding:7px 11px;font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.08);animation:balao .4s cubic-bezier(.34,1.6,.64,1)}
.balao::after{content:'';position:absolute;left:20px;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes balao{from{transform:scale(.4);opacity:0}}
.abas{display:flex;gap:6px;padding:12px 12px 6px;overflow-x:auto}
.aba{flex-shrink:0;padding:7px 14px;border-radius:14px;background:#fff;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(91,70,54,.1)}
.aba.on{background:var(--tiffany);color:#fff;box-shadow:0 3px 0 var(--tiffanyE)}
.aba.bloq{opacity:.45}
.itens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px;overflow-y:auto}
.item{background:#fff;border-radius:16px;padding:8px 4px;text-align:center;font-weight:800;font-size:12px;box-shadow:0 3px 0 rgba(91,70,54,.1);position:relative}
.item .ic{font-size:26px;display:block}
.item .preco{display:inline-block;margin-top:3px;background:#fff4d6;color:#b07d10;border-radius:10px;padding:1px 8px;font-size:12px}
.item.feito{background:#e3f6ee}
.item.feito .preco{background:#c9eedc;color:#2f8a5f}
.item.pode{animation:pode 1.2s infinite}
@keyframes pode{50%{transform:translateY(-3px)}}
.progresso{margin:4px 12px;height:10px;background:#fff;border-radius:6px;overflow:hidden}
.progresso i{display:block;height:100%;background:linear-gradient(90deg,var(--tiffany),var(--ouro));transition:width .5s}
.rodape-casa{margin-top:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.btn{display:block;width:100%;padding:14px;border-radius:18px;font-size:19px;font-weight:900;color:#fff;background:linear-gradient(180deg,#9ee5de,var(--tiffany));box-shadow:0 5px 0 var(--tiffanyE);text-align:center}
.btn.ouro{background:linear-gradient(180deg,#ffd97a,var(--ouro));box-shadow:0 5px 0 #c99a2e;color:#6a4a10}
.btn.sec{background:#fff;color:var(--txt);box-shadow:0 5px 0 rgba(91,70,54,.15)}
.btn:active{transform:translateY(3px)}
.btn small{display:block;font-size:12px;opacity:.85}
.mini{width:auto;flex:0 0 auto;padding:14px 16px;font-size:20px}
/* jogo */
#t-jogo{background:linear-gradient(180deg,#e3f6ee,#fdf3e7)}
#tab{position:relative;flex:1;margin:4px 8px;min-height:0}
.peca{position:absolute;border-radius:12px;background:linear-gradient(180deg,#fffaf2,#fbe9d2);box-shadow:0 5px 0 #d9b892,0 7px 6px rgba(91,70,54,.25);display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .15s;cursor:pointer}
.peca span{font-size:calc(var(--ts)*.58);line-height:1;filter:saturate(.85)}
.peca.coberta{filter:brightness(.62) saturate(.6);cursor:default}
.peca:not(.coberta):active{transform:scale(.94)}
.peca .gelo{position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(200,240,255,.85),rgba(150,210,245,.65));border:2px solid #fff;display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 5px;font-weight:900;font-size:13px;color:#2a7fb0}
.peca .corrente{position:absolute;inset:-2px;border-radius:12px;border:3px dashed #7a7f88;background:rgba(80,80,90,.25);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ts)*.4)}
.peca.chave{background:linear-gradient(180deg,#fff6cf,#ffe28a);box-shadow:0 5px 0 #c99a2e,0 0 14px rgba(242,193,78,.8)}
.peca.treme{animation:treme .3s}
.peca.dica{animation:dica .8s infinite}
@keyframes treme{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes dica{50%{transform:translateY(-6px) scale(1.06)}}
.bandeja{margin:6px 10px;background:linear-gradient(180deg,var(--madeira),var(--madeiraE));border-radius:18px;padding:7px;box-shadow:0 6px 0 #6b4220;position:relative}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative}
.slot{aspect-ratio:1;border-radius:10px;background:rgba(0,0,0,.2);box-shadow:inset 0 3px 4px rgba(0,0,0,.25)}
.bandeja.alerta{animation:alerta .6s infinite}
@keyframes alerta{50%{box-shadow:0 6px 0 #6b4220,0 0 0 4px #ff8a8a}}
.voa{position:fixed;z-index:20;border-radius:10px;background:linear-gradient(180deg,#fffaf2,#fbe9d2);box-shadow:0 4px 0 #d9b892;display:flex;align-items:center;justify-content:center;transition:left .28s cubic-bezier(.3,1.2,.5,1),top .28s cubic-bezier(.3,1.2,.5,1),width .28s,height .28s,transform .2s,opacity .2s;pointer-events:none}
.voa span{line-height:1}
.voa.some{transform:scale(1.4);opacity:0}
.boosters{display:flex;gap:8px;padding:6px 10px calc(10px + env(safe-area-inset-bottom));justify-content:center}
.bo{flex:1;max-width:120px;background:#fff;border-radius:16px;padding:6px;font-weight:900;font-size:13px;box-shadow:0 4px 0 rgba(91,70,54,.15);line-height:1.15}
.bo b{display:block;font-size:22px}
.bo small{display:block;font-size:11px;color:#b07d10}
.bo:active{transform:translateY(2px)}
.part{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:25;animation:part .7s ease-out forwards}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.grito{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;z-index:30;color:#fff;-webkit-text-stroke:2px #e78fb0;text-shadow:0 4px 0 #c95f88;pointer-events:none;animation:grito 1.1s forwards;white-space:nowrap}
@keyframes grito{0%{transform:translate(-50%,-50%) scale(.2)}25%{transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{transform:translate(-50%,-90%);opacity:0}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:9px 16px;border-radius:18px;font-weight:800;font-size:14px;z-index:40;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(91,70,54,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.mbox{background:var(--creme);border-radius:26px;padding:22px 18px 18px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 0 rgba(91,70,54,.2);animation:entra .35s cubic-bezier(.34,1.5,.64,1);max-height:92dvh;overflow-y:auto}
@keyframes entra{from{transform:scale(.6);opacity:0}}
.mbox h2{font-size:26px;color:#c95f88}
.mbox p{margin-top:6px;line-height:1.4}
.estrela{font-size:64px;animation:gira 1s cubic-bezier(.34,1.6,.64,1)}
@keyframes gira{from{transform:scale(0) rotate(-180deg)}}
.premio{display:inline-flex;gap:8px;margin-top:6px}
.premio span{background:#fff;border-radius:12px;padding:4px 12px;font-weight:900}
.gatos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.gc{background:#fff;border-radius:14px;padding:4px;font-size:11px;font-weight:800}
.gc canvas{display:block;width:100%;aspect-ratio:1}
.gc.bloq canvas{filter:brightness(0) opacity(.15)}
.regras{text-align:left;font-size:14px;line-height:1.5;margin-top:8px}
.regras li{margin:4px 0 4px 18px}
footer{text-align:center;font-size:10px;opacity:.55;padding-bottom:4px}
</style>
</head>
<body>
<div class="app">

  <!-- CASA -->
  <section class="tela on" id="t-casa">
    <div class="topo">
      <a class="chip" href="../index.html">‹</a>
      <div class="titulo">🐾 Lar dos Gatinhos</div>
      <span class="chip ouro" id="c-est">⭐ 0</span>
      <span class="chip" id="c-moe">🪙 0</span>
    </div>
    <div class="cena-casa"><canvas id="casa" width="720" height="480"></canvas><div class="balao" id="balao"></div></div>
    <div class="abas" id="abas"></div>
    <div class="progresso"><i id="prog"></i></div>
    <div class="itens" id="itens"></div>
    <div class="rodape-casa">
      <button class="btn sec mini" id="b-gatos">🐱</button>
      <button class="btn ouro" id="b-jogar">Jogar fase 1<small>ganhe ⭐ para decorar</small></button>
      <button class="btn sec mini" id="b-som">🔊</button>
    </div>
    <footer id="rodape"></footer>
  </section>

  <!-- JOGO -->
  <section class="tela" id="t-jogo">
    <div class="topo">
      <button class="chip" id="j-casa">🏠</button>
      <div class="titulo" id="j-fase">Fase 1</div>
      <span class="chip" id="j-resta">🧩 0</span>
      <span class="chip" id="j-moe">🪙 0</span>
    </div>
    <div id="tab"></div>
    <div class="bandeja" id="bandeja"><div class="slots" id="slots"></div></div>
    <div class="boosters">
      <button class="bo" id="bo-desf"><b>↩️</b>Desfazer<small id="pr-desf"></small></button>
      <button class="bo" id="bo-ima"><b>🧲</b>Ímã<small id="pr-ima"></small></button>
      <button class="bo" id="bo-mist"><b>🔀</b>Misturar<small id="pr-mist"></small></button>
    </div>
  </section>

</div>
<div id="toast"></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script src="../familia/cenario.js"></script>
<script src="casa.js"></script>
<script src="jogo.js"></script>
</body>
</html>
